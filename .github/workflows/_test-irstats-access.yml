name: test-irstats-access
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: curl irstats.com
        run: |
          curl -sS -D - -o body.html "https://irstats.com/driver/958741" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" \
            | head -40
          echo "--- body head ---"
          head -c 800 body.html
      - name: playwright headless browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-chromium@1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node -e "
          const { chromium } = require('playwright-chromium');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const response = await page.goto('https://irstats.com/driver/958741', { waitUntil: 'domcontentloaded', timeout: 30000 });
            console.log('STATUS', response.status());
            const title = await page.title();
            console.log('TITLE', title);
            const text = await page.content();
            console.log('BODY_SNIPPET', text.slice(0, 500));
            await browser.close();
          })().catch((e) => { console.error('ERROR', e.message); process.exit(1); });
          "
