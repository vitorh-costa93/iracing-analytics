<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45">
  <!-- Favicon reusing the app's own .brand-mark mark (app/globals.css) instead of a generic globe --
       same shape/colors as the diagonal blue/white/red stripes already in the header, computed from
       the CSS skewX(-25deg) geometry so the tab icon matches the in-app logo exactly. -->
  <defs>
    <clipPath id="r"><rect width="45" height="45" rx="3" ry="3"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="45" height="45" fill="#101011"/>
    <polygon points="-6.90,5 36.10,5 31.90,14 -11.10,14" fill="#1c4f9c"/>
    <polygon points="9.63,19 41.63,19 38.37,26 6.37,26" fill="#f2f1ee"/>
    <polygon points="18.17,31 42.17,31 39.83,36 15.83,36" fill="#e2231a"/>
  </g>
</svg>
